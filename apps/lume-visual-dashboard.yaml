apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lume-visual-dashboard
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/slaclab/lume-visual-dashboard
    targetRevision: main
    path: deploy/kubernetes/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: lume-visual-dashboard
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
